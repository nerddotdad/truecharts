# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: larpos
  namespace: larpos
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 10m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      truenas_garage:
        type: s3
        url: "${GARAGE_URL}"
        region: garage
        bucket: truecharts
        accessKey: "${GARAGE_ACCESS_KEY_ID}"
        secretKey: "${GARAGE_SECRET_ACCESS_KEY}"
        encrKey: "${ADMIN_PASS}"

    image:
      repository: ghcr.io/nerddotdad/larpos
      pullPolicy: IfNotPresent
      # Bare semver only. sha-* and latest are ignored (see .github/RENOVATE-GHCR.md).
      # renovate: datasource=docker depName=ghcr.io/nerddotdad/larpos
      tag: sha-7b6d46a

    # Private GHCR package. Chart creates the dockerconfigjson secret.
    imagePullSecret:
      ghcr:
        enabled: true
        data:
          registry: ghcr.io
          username: nerddotdad
          password: "${GHCR_PULL_TOKEN}"
          email: "${DOMAIN_0_EMAIL}"

    # Image USER is nextjs (uid/gid 1001). One replica: state is a single JSON file.
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      pod:
        fsGroup: 1001

    workload:
      main:
        replicas: 1
        strategy: Recreate
        podSpec:
          containers:
            main:
              enabled: true
              probes:
                startup:
                  enabled: true
                  type: http
                  port: 43127
                  path: /
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 18
                liveness:
                  enabled: true
                  type: http
                  port: 43127
                  path: /
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readiness:
                  enabled: true
                  type: http
                  port: 43127
                  path: /
                  initialDelaySeconds: 5
                  periodSeconds: 10
              env:
                NODE_ENV: production
                HOSTNAME: 0.0.0.0
                PORT: "43127"
                DATA_DIR: /data
                APP_URL: "https://larpos.${DOMAIN_0}"
                ADMIN_EMAIL: "${LARPOS_ADMIN_EMAIL}"
                ADMIN_PASSWORD: "${LARPOS_ADMIN_PASSWORD}"
                ADMIN_NAME: Camp Admin
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 512Mi
                  cpu: "500m"

    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 43127
            protocol: tcp
            targetPort: 43127

    persistence:
      data:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        mountPath: /data
        volsync:
          - name: data
            type: restic
            credentials: truenas_garage
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: "30 3 * * *"

    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: larpos.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            name: LARPos
            description: LARP manager
            group: gaming
            icon: ""
            widget:
              enabled: false
