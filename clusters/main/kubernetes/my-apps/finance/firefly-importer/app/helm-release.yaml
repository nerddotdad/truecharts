---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# TrueCharts does not ship the Data Importer (add-ons are out of scope).
# https://truecharts.org/charts/stable/fireflyiii/installation_notes/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-importer
  namespace: finance
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.16.14
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 10m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: docker.io/fireflyiii/data-importer
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=fireflyiii/data-importer
      tag: version-2.3.4

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsUser: 33
        runAsGroup: 33

    workload:
      main:
        podSpec:
          containers:
            main:
              enabled: true
              probes:
                startup:
                  enabled: true
                  type: http
                  port: 8080
                  path: /health
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 30
                liveness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /health
                  periodSeconds: 30
                readiness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /health
                  periodSeconds: 10
              fixedEnv:
                TZ: America/Los_Angeles
              env:
                APP_URL: "https://firefly-import.${DOMAIN_0}"
                FIREFLY_III_URL: "http://fireflyiii.finance.svc.cluster.local:10082"
                VANITY_URL: "https://firefly.${DOMAIN_0}"
                TRUSTED_PROXIES: "*"
                # FIREFLY_III_ACCESS_TOKEN and SIMPLEFIN_TOKEN are entered in the
                # importer UI after first Firefly login. Add to clusterenv later
                # if you want them injected (requires clustertool encrypt + genconfig).

    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 8080
            protocol: tcp
            targetPort: 8080

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: firefly-import.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          homepage:
            enabled: true
            name: Firefly Importer
            description: SimpleFIN and CSV import into Firefly III
            group: finance
            icon: mdi-bank-transfer
            widget:
              enabled: false
