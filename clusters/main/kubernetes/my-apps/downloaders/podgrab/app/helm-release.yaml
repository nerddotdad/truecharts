---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podgrab
  namespace: downloaders
spec:
  interval: 15m
  chart:
    spec:
      chart: podgrab
      version: 21.10.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Downloads land in /assets/<podcast>/, which Jellyfin reads at /media/podcasts.
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
      pod:
        fsGroup: 568
    credentials:
      truenas_garage:
        type: s3
        url: "${GARAGE_URL}"
        region: garage
        bucket: truecharts
        accessKey: "${GARAGE_ACCESS_KEY_ID}"
        secretKey: "${GARAGE_SECRET_ACCESS_KEY}"
        encrKey: "${ADMIN_PASS}"
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                CONFIG: /config
                DATA: /assets
                CHECK_FREQUENCY: "240"
                PASSWORD: "${ADMIN_PASS}"
                PUID: "568"
                PGID: "568"
    persistence:
      config:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: truenas_garage
            cleanupTempPVC: true
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: "10 1 * * *"
      assets:
        enabled: true
        type: nfs
        mountPath: /assets
        path: ${NFS_MEDIA}/podcasts
        server: ${NAS_IP}
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: podgrab.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
          homepage:
            enabled: true
            name: Podgrab
            description: Podcast downloader for Jellyfin
            group: "{{ .Release.Namespace }}"
            icon: ""
            widget:
              enabled: false
