apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonwilds
  namespace: gaming
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      truenas_garage:
        type: s3
        url: "${GARAGE_URL}"
        region: garage
        bucket: truecharts
        accessKey: "${GARAGE_ACCESS_KEY_ID}"
        secretKey: "${GARAGE_SECRET_ACCESS_KEY}"
        encrKey: "${ADMIN_PASS}"
    image:
      repository: indifferentbroccoli/runescape-dragonwilds-server-docker
      pullPolicy: IfNotPresent
      tag: v1.0.2

    securityContext:
      container:
        readOnlyRootFilesystem: false
        # Set to 568 so the chart injects PUID/PGID=568.
        # The container override below still starts as root so the image can drop to that user.
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
      pod:
        fsGroup: 568

    workload:
      main:
        podSpec:
          terminationGracePeriodSeconds: 60
          initContainers:
            fix-permissions:
              enabled: true
              type: init
              image: docker.io/library/alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  # TrueCharts mounts persistence volumes into init containers.
                  chown -R 568:568 /home/steam/server-files || true
                  chmod -R 755 /home/steam/server-files || true
              securityContext:
                runAsUser: 0
                runAsGroup: 0
          containers:
            main:
              enabled: true
              securityContext:
                readOnlyRootFilesystem: false
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
              # Download and first boot can take several minutes; skip probes so that does not restart the pod.
              probes:
                startup:
                  enabled: false
                liveness:
                  enabled: false
                readiness:
                  enabled: false
              env:
                # https://github.com/indifferentbroccoli/runescape-dragonwilds-server-docker
                # PUID and PGID are set by the chart from securityContext.
                SERVER_NAME: "Hoth Dragonwilds"
                DEFAULT_WORLD_NAME: "Hoth"
                OWNER_ID: "${DRAGONWILDS_OWNER_ID}"
                ADMIN_PASSWORD: "${ADMIN_PASS}"
                WORLD_PASSWORD: "${ENSHROUDED_MEMBER_PASS}"
                DEFAULT_PORT: "7777"
                BEACON_PORT: "8888"
                MAX_PLAYERS: "6"
                UPDATE_ON_START: "true"
              resources:
                requests:
                  memory: "6Gi"
                  cpu: "2000m"
                limits:
                  memory: "10Gi"
                  cpu: "4000m"

    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${DRAGONWILDS_IP}
        externalTrafficPolicy: Local
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            enabled: true
            port: 7777
            protocol: udp
          beacon:
            enabled: true
            port: 8888
            targetPort: 8888
            protocol: udp

    persistence:
      data:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 20Gi
        mountPath: /home/steam/server-files
        volsync:
          - name: data
            type: restic
            credentials: truenas_garage
            dest:
              enabled: false
            src:
              enabled: false
