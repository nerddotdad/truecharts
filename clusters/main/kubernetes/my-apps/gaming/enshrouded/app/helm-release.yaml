apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: enshrouded
  namespace: gaming
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    credentials:
      truenas_garage:
        type: s3
        url: "${GARAGE_URL}"
        region: garage
        bucket: truecharts
        accessKey: "${GARAGE_ACCESS_KEY_ID}"
        secretKey: "${GARAGE_SECRET_ACCESS_KEY}"
        encrKey: "${ADMIN_PASS}"
    image:
      repository: mornedhels/enshrouded-server
      pullPolicy: IfNotPresent
      tag: stable-wine

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        # The image installs UPDATE_CRON with setgid crontab. The chart default
        # blocks that, so the schedule is never written and the updater runs once.
        allowPrivilegeEscalation: true
      pod:
        fsGroup: 0

    workload:
      main:
        podSpec:
          terminationGracePeriodSeconds: 90
          containers:
            main:
              enabled: true
              securityContext:
                readOnlyRootFilesystem: false
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: true
              probes:
                startup:
                  enabled: true
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - |
                      supervisorctl status enshrouded-server 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-updater 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-bootstrap 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-force-update 2>/dev/null | grep -q RUNNING && exit 0
                      exit 1
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 40
                liveness:
                  enabled: true
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - |
                      supervisorctl status enshrouded-server 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-updater 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-bootstrap 2>/dev/null | grep -q RUNNING && exit 0
                      supervisorctl status enshrouded-force-update 2>/dev/null | grep -q RUNNING && exit 0
                      exit 1
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
                readiness:
                  enabled: true
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - supervisorctl status enshrouded-server 2>/dev/null | grep -q RUNNING
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              env:
                # https://hub.docker.com/r/mornedhels/enshrouded-server
                # https://github.com/mornedhels/enshrouded-server/blob/main/docs/SERVER_ROLES.md
                SERVER_NAME: "Hoth Enshrouded Server"
                SERVER_ENABLE_VOICE_CHAT: "true"
                SERVER_VOICE_CHAT_MODE: "Proximity"
                SERVER_ENABLE_TEXT_CHAT: "true"
                PRESET: "Custom"
                SERVER_ROLE_0_NAME: "Admins"
                SERVER_ROLE_0_PASSWORD: "${ADMIN_PASS}"
                SERVER_ROLE_0_CAN_KICK_BAN: "true"
                SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: "true"
                SERVER_ROLE_0_CAN_EDIT_WORLD: "true"
                SERVER_ROLE_0_CAN_EDIT_BASE: "true"
                SERVER_ROLE_0_CAN_EXTEND_BASE: "true"
                SERVER_ROLE_0_RESERVED_SLOTS: "1"
                SERVER_ROLE_1_NAME: "Friends"
                SERVER_ROLE_1_PASSWORD: "${ENSHROUDED_MEMBER_PASS}"
                SERVER_ROLE_1_CAN_ACCESS_INVENTORIES: "true"
                SERVER_ROLE_1_CAN_EDIT_WORLD: "true"
                SERVER_ROLE_1_CAN_EDIT_BASE: "true"
                SERVER_ROLE_1_CAN_EXTEND_BASE: "true"
                SERVER_ROLE_1_RESERVED_SLOTS: "3"
                UPDATE_CRON: "*/30 * * * *"
                UPDATE_CHECK_PLAYERS: "true"
                BACKUP_CRON: "0 */6 * * *"
                BACKUP_MAX_COUNT: "20"
              resources:
                requests:
                  memory: "11Gi"
                  cpu: "4000m"
                limits:
                  memory: "16Gi"
                  cpu: "8000m"

    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${ENSHROUDED_IP}
        externalTrafficPolicy: Local
        integrations:
          metallb:
            enabled: true
        ports:
          main:
            enabled: true
            port: 15636
            protocol: udp
          query:
            enabled: true
            port: 15637
            targetPort: 15637
            protocol: udp

    persistence:
      data:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 20Gi
        mountPath: /opt/enshrouded
        volsync:
          - name: data
            type: restic
            credentials: truenas_garage
            dest:
              enabled: false
            src:
              enabled: false
