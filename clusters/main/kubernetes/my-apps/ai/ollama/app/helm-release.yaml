apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ai
spec:
  interval: 15m
  chart:
    spec:
      chart: ollama
      version: 9.29.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 10m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0

    podOptions:
      runtimeClassName: "nvidia"
      tolerations:
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule

    resources:
      requests:
        nvidia.com/gpu: 1
        memory: 6Gi
      limits:
        nvidia.com/gpu: 1
        memory: 24Gi

    service:
      main:
        enabled: false
      api:
        primary: true
        ports:
          api:
            primary: true

    workload:
      main:
        type: Deployment
        podSpec:
          runtimeClassName: "nvidia"
          containers:
            main:
              env:
                OLLAMA_HOST: "0.0.0.0:11434"
                OLLAMA_ORIGINS: "*"
                OLLAMA_FLASH_ATTENTION: "1"
                OLLAMA_KEEP_ALIVE: "24h"
                # Hot-set rotates under VRAM pressure on a 24GB GPU.
                OLLAMA_MAX_LOADED_MODELS: "2"
                # 131072 ÷ 2 slots = 65536 tokens/slot — meets Hermes 64K minimum per session.
                OLLAMA_NUM_PARALLEL: "2"
                OLLAMA_KV_CACHE_TYPE: "q8_0"
                # 2Gi reserved so Kokoro TTS can share the 3090 (time-slicing does not split VRAM).
                OLLAMA_GPU_OVERHEAD: "2147483648"
                OLLAMA_CONTEXT_LENGTH: "131072"
      ui:
        enabled: false

    persistence:
      config:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 40Gi
        mountPath: "/root/.ollama"
        targetSelector:
          main:
            main:
              mountPath: "/root/.ollama"
      data:
        enabled: false

    ingress:
      main:
        enabled: false
      api:
        primary: true
        enabled: true
        ingressClassName: external
        # First OpenCode/Hearth token can exceed nginx's 60s default while Ollama
        # prefills a 64K–131K prompt (or reloads weights after a model swap).
        annotations:
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
        hosts:
          - host: ollama-api.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: "domain-0-le-prod"
          homepage:
            enabled: true
            name: ollama
            description: Ollama LLM API (qwen3.5:9b/gemma4:26b/coder-30b + embedding, 64K/slot, GPU)
            group: ai
            icon: ""
            widget:
              enabled: false
