# Libredesk via TrueCharts app-template:
# - cnpg.main from common (https://truecharts.org/common/cnpg/cnpg/)
# - redis.enabled → Valkey subchart (app-template Chart.yaml dependency)
# Env wiring follows onlyoffice-document-server pattern (cnpg-main-* + rediscreds secrets).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: libredesk
  namespace: communication
spec:
  # Faster Git→Helm apply while debugging; raise to 15m once stable.
  interval: 1m
  chart:
    spec:
      chart: app-template
      version: 18.20.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  # Don't block Helm on Deployment Ready — CrashLoop was preventing config upgrades.
  timeout: 5m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    disableWait: true
    disableWaitForJobs: true
    remediation:
      retries: 1
      remediateLastFailure: false
  upgrade:
    disableWait: true
    disableWaitForJobs: true
    cleanupOnFail: true
    remediation:
      retries: 1
      remediateLastFailure: false
  uninstall:
    keepHistory: false
  values:
    image:
      repository: docker.io/libredesk/libredesk
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=libredesk/libredesk
      tag: v2.8.0

    cnpg:
      main:
        enabled: true
        primary: true
        type: postgres
        pgVersion: 16
        database: libredesk
        user: libredesk
        password: ${LIBREDESK_DB_PASSWORD}
        cluster:
          instances: 1
          singleNode: true
          storage:
            size: 5Gi
            storageClass: longhorn

    redis:
      enabled: true
      password: ${LIBREDESK_REDIS_PASSWORD}

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    workload:
      main:
        podSpec:
          containers:
            main:
              enabled: true
              primary: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  CFG=/config/config.toml
                  ./libredesk --install --idempotent-install --yes --config="$CFG"
                  ./libredesk --upgrade --yes --config="$CFG"
                  exec ./libredesk --config="$CFG"
              probes:
                startup:
                  enabled: true
                  type: http
                  port: 9000
                  path: /health
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 30
                liveness:
                  enabled: true
                  type: http
                  port: 9000
                  path: /health
                  periodSeconds: 30
                readiness:
                  enabled: true
                  type: http
                  port: 9000
                  path: /health
                  periodSeconds: 10
              env:
                # Secrets / runtime overrides (env wins over config.toml)
                LIBREDESK_SYSTEM_USER_PASSWORD: ${ADMIN_PASS}
                LIBREDESK_APP__ENCRYPTION_KEY: ${LIBREDESK_ENCRYPTION_KEY}
                LIBREDESK_DB__HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                LIBREDESK_DB__PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                LIBREDESK_REDIS__ADDRESS:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: plainporthost
                LIBREDESK_REDIS__PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 1Gi
                  cpu: "1"

    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 9000
            protocol: tcp
            targetPort: 9000

    persistence:
      config:
        enabled: true
        type: configmap
        objectName: libredesk-config
        expandObjectName: false
        mountPath: /config
        readOnly: true
        defaultMode: "0444"
      uploads:
        enabled: true
        type: pvc
        size: 5Gi
        storageClass: longhorn
        accessMode: ReadWriteOnce
        mountPath: /libredesk/uploads

    ingress:
      main:
        enabled: true
        ingressClassName: external
        annotations:
          # Libredesk Widget API is used cross-origin from tjhoth.me (Pages);
          # upstream does not emit CORS — nginx handles preflight for the terminal client.
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/cors-allow-origin: "https://tjhoth.me, https://www.tjhoth.me"
          nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PUT, PATCH, DELETE"
          nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Libredesk-Inbox-ID,X-Libredesk-Visitor-Token"
          nginx.ingress.kubernetes.io/cors-expose-headers: "X-Libredesk-Clear-Visitor"
          nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: 30m
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
        hosts:
          - host: support.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          homepage:
            enabled: true
            name: Libredesk
            description: Self-hosted support inbox for tjhoth.me
            group: communication
            icon: mdi-headset
            widget:
              enabled: false
