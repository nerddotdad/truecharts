# Non-secret Libredesk defaults (sample-aligned). Secrets come from env in the HelmRelease.
apiVersion: v1
kind: ConfigMap
metadata:
  name: libredesk-config
  namespace: communication
data:
  config.toml: |
    [app]
    log_level = "info"
    env = "prod"
    check_updates = true
    # Overridden by LIBREDESK_APP__ENCRYPTION_KEY
    encryption_key = "placeholder-replaced-by-env!!!!!!!!"

    [app.server]
    address = "0.0.0.0:9000"
    socket = ""
    disable_secure_cookies = false
    session_lifetime = "9h"
    read_timeout = "8s"
    write_timeout = "60s"
    max_body_size = 104857600
    read_buffer_size = 65536
    keepalive_timeout = "10s"

    [upload]
    provider = "fs"

    [upload.fs]
    upload_path = "uploads"
    expiry = "1h"

    [db]
    # host/password overridden by env / secretKeyRef
    host = "localhost"
    port = 5432
    user = "libredesk"
    password = "placeholder"
    database = "libredesk"
    ssl_mode = "require"
    max_open = 30
    max_idle = 30
    max_lifetime = "300s"

    [redis]
    # address/password overridden by env / secretKeyRef
    address = "localhost:6379"
    user = ""
    password = ""
    db = 0

    [message]
    outgoing_queue_workers = 10
    incoming_queue_workers = 10
    message_outgoing_scan_interval = "50ms"
    incoming_queue_size = 5000
    outgoing_queue_size = 5000

    [notification]
    concurrency = 2
    queue_size = 2000

    [automation]
    worker_count = 10

    [ai_agent]
    worker_count = 10
    queue_size = 1000
    max_steps = 6
    max_history_messages = 30

    [autoassigner]
    autoassign_interval = "5m"

    [webhook]
    workers = 5
    queue_size = 10000
    timeout = "15s"

    [ssrf]
    enabled = false
    allowed_cidrs = []

    [conversation]
    unsnooze_interval = "5m"
    draft_retention_duration = "360h"
    continuity_scan_interval = "5m"

    [sla]
    evaluation_interval = "5m"
