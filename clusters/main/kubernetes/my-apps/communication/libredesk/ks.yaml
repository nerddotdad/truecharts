apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: libredesk
  namespace: flux-system
spec:
  # Faster feedback while bringing Libredesk up; raise to 10m once stable.
  interval: 1m
  path: clusters/main/kubernetes/my-apps/communication/libredesk/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
